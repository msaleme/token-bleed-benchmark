experiment_id: token-bleed-mac-r3
baseline: ungoverned-context-stuffing
mutation_scope: [synthetic-catalog, route-selection, named-mac-local-endpoint]
trials: 60
quality_floor: {metric: f1, minimum_relative_to_baseline: 0.98}
benchmark_sets:
  development: [synthetic-catalog-300]
  validation: [synthetic-catalog-1500]
  holdout: [synthetic-catalog-3000]
acceptance:
  minimum_ecd_improvement: 0.5
  require_statistical_significance: true
  confidence_interval_excludes_zero: true
  require_validation_transfer: true
  require_holdout_pass: true
reporting: {report_format: [json, markdown]}
trial_configuration:
  seeds: [62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76, 77, 78, 79, 80, 81]
  classifier_false_negative_rates: [0.0, 0.05, 0.10]
  classifier_false_positive_rate: 1.0
  route_order: independently-randomized-per-seed-and-false-negative-rate
telemetry_provenance: measured
execution:
  per_call_timeout_seconds: 1800
  requested_completion_tokens: 3000
  local_ollama_context_verification: required
  completion_cap_enforcement: required
  completion_cap_parameter: max_tokens
claim_scopes:
  selective_context_cost_vs_full:
    comparison: governed-vs-ungoverned
    classifier_false_negative_rate: 0.0
    required_mean_prompt_token_reduction: 0.5
    required_splits: [development, validation, holdout]
  governed_quality_vs_full:
    comparison: governed-vs-ungoverned
    classifier_false_negative_rate: 0.0
    minimum_paired_f1_ci_lower_bound: -0.02
    required_splits: [validation, holdout]
  governed_value_vs_lexical:
    comparison: governed-vs-lexical
    classifier_false_negative_rate: 0.0
    require_holdout_f1_ci_excludes_zero_in_favor: true
    maximum_mean_prompt_tokens_relative_to_lexical: 1.10
  governed_sensitivity_vs_lexical:
    comparison: governed-vs-lexical
    classifier_false_negative_rates: [0.05, 0.10]
    require_same_quality_and_token_rules_as_governed_value_vs_lexical: true
